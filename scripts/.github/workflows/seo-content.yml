name: SEO Content System

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run internal linking system
        run: |
          python scripts/auto_internal_links.py

      - name: Commit SEO updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "*.html"

          if git diff --cached --quiet; then
            echo "No SEO changes were required."
          else
            git commit -m "chore: update internal links"
            git push
          fi
