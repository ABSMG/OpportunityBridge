<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">OpportunityBridge Logo</title>
  <desc id="desc">A bridge connecting people to global opportunities</desc>

  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3d91"/>
      <stop offset="100%" stop-color="#1769d1"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4c542"/>
      <stop offset="100%" stop-color="#ffd966"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="20" y="20" width="200" height="200" rx="42"
        fill="url(#blueGradient)"/>

  <!-- Global circle -->
  <circle cx="120" cy="105" r="55"
          fill="none"
          stroke="#ffffff"
          stroke-width="8"/>

  <!-- Globe lines -->
  <path d="M65 105 H175"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"/>

  <path d="M120 50
           C92 70 92 140 120 160
           C148 140 148 70 120 50Z"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"/>

  <!-- Bridge -->
  <path d="M55 165
           C82 125 158 125 185 165"
        fill="none"
        stroke="url(#goldGradient)"
        stroke-width="12"
        stroke-linecap="round"/>

  <!-- Bridge pillars -->
  <path d="M72 158 V180 M168 158 V180"
        stroke="#f4c542"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- Opportunity path -->
  <path d="M120 168 V192"
        stroke="#ffffff"
        stroke-width="7"
        stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="255" y="125"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#0b3d91">
    Opportunity
  </text>

  <text x="255" y="185"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#1769d1">
    Bridge
  </text>

  <!-- Tagline -->
  <text x="515" y="218"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="600"
        fill="#64748b">
    GLOBAL OPPORTUNITIES
  </text>
</svg>
