name: Test Opportunity Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run opportunity discovery
        run: |
          python scripts/opportunity_discovery.py

      - name: Show discoveries
        run: |
          cat data/discovered_opportunities.json

      - name: Save discoveries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/discovered_opportunities.json

          if git diff --cached --quiet; then
            echo "No new discovery data."
          else
            git commit -m "chore: update opportunity discoveries"
            git push
          fi
