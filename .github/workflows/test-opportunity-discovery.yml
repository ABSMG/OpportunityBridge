name: Test Opportunity Discovery

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run opportunity discovery
        run: |
          python scripts/opportunity_discovery.py

      - name: Verify opportunities
        run: |
          python scripts/opportunity_verifier.py

      - name: Show verified opportunities
        run: |
          cat data/verified_opportunities.json

      - name: Approve opportunities
        run: |
          python scripts/opportunity_approval.py

      - name: Show approved opportunities
        run: |
          cat data/approved_opportunities.json
      - name: Generate opportunity articles
        run: |
          python scripts/opportunity_article_generator.py
      - name: Show discoveries
        run: |
          cat data/discovered_opportunities.json

      - name: Save discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "*.html" data/discovered_opportunities.json data/verified_opportunities.json data/approved_opportunities.json

          if git diff --cached --quiet; then
            echo "No new opportunity data."
          else
            git commit -m "chore: update opportunity discoveries"
            git push
          fi
